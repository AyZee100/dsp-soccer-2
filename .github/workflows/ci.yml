name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pandas fastapi sqlalchemy pydantic requests
          pip install -r model_service/requirements.txt
          pip install -r webapp/requirements.txt

      - name: Lint
        run: flake8 model_service webapp dags scripts tests --max-line-length=120

      - name: Run tests
        run: pytest -q
