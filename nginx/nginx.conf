server {
    listen 80;
    server_name localhost;

    # Serves the Great Expectations Data Docs generated by the ingestion DAG
    # (written to ./data/gx_data_docs, mounted read-only at /usr/share/nginx/html).
    root /usr/share/nginx/html;
    index index.html;

    # Allow browsing report folders directly from a Teams alert link.
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
